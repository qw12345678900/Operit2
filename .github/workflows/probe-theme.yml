name: Probe Theme Runtime Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: -Awarnings
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc -Vv && cargo -V
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: probe-runtime-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            runtime-tests-
            probe-runtime-
      - name: Theme preference tests
        working-directory: core
        run: cargo test -p operit-runtime --lib -- data::preferences --nocapture 2>&1 | tail -n 600
